      - { vendor: microsoft, product: windows_11_25h2 }
      - { vendor: microsoft, product: windows_11_26h1 }
      - { vendor: microsoft, product: windows_server_2008 }
      - { vendor: microsoft, product: windows_server_2012 }
      - { vendor: microsoft, product: windows_server_2016 }
      - { vendor: microsoft, product: windows_server_2019 }
      - { vendor: microsoft, product: windows_server_2022 }
      - { vendor: microsoft, product: windows_server_2022_23h2 }
      - { vendor: microsoft, product: windows_server_2025 }
    kev:
