# product-alias.yml — 제품 이름 표준화 표의 초기 데이터 (기획서 5장 product_alias, 메모 P11, WBS 0.5)
#
# 모양: 제품(slug) 하나에 CPE 별칭과 KEV 별칭을 여럿 단다. 적재기가 별칭 하나를 product_alias 한 행으로 펼친다.
#   slug         : 제품 묶음 키(소문자·숫자·하이픈). affected_product.slug 에 들어간다
#   display_name : 사이트에 보이는 이름. vulnerability.primary_product 에 들어간다
#   cpe          : NVD CPE 2.3 cpe:2.3:<part>:<vendor>:<product>:... 의 vendor·product 원문
#   kev          : CISA KEV 의 vendorProject·product 원문(대소문자·공백 그대로)
# 키 정규화: 적재와 조회 양쪽에서 같은 규칙을 쓴다 — 소문자로 바꾸고, 영문·숫자가 아닌 글자가 이어지면 밑줄 하나로,
#   앞뒤 밑줄은 뗀다. 예) "Palo Alto Networks"/"PAN-OS" → palo_alto_networks/pan_os, google/chrome → google/chrome
#   그래서 CPE 와 KEV 별칭이 같은 (cpe_vendor, cpe_product) 열에 함께 들어간다. 테이블 열은 추가하지 않는다.
# 범위: 정규화한 (vendor, product) 가 정확히 같을 때만 매핑한다. 미매핑 제품은 CPE product 원문 그대로 보인다(기획서 5장 메모).
#   공개 후 2주 튜닝 루틴에서 메인 상위에 올라온 미매핑 제품을 여기에 추가한다(기획서 10장).
#
# 확정 2026-10-31 (사용자, 오케스트레이터 권고안대로)
#   (a) "초기 50개"는 제품(slug) 50개로 해석한다. 별칭을 펼친 행은 그보다 많다.
#   (b) Windows Server 는 windows 로 합친다. NVD 표본에서 windows_server_* 가 CPE 첫 항목으로 나온 적이 없다.
#   (c) KEV 매핑(리스크 R7)은 혼합안: KEV 원문 별칭을 여기에 명시하고, 적재·조회 양쪽에 같은 정규화를 쓰며,
#       테이블 열은 추가하지 않는다. KEV 의 "Multiple Products" 류는 매핑하지 않고 CPE 첫 항목으로 넘긴다(WBS 2.3).
#
# 근거 데이터(2026-10-30 백엔드 B 조사)
#   - CISA KEV 카탈로그 2026.10.29판(1764건)의 vendorProject/product 빈도와 표기 변형
#   - NVD 2026-08 발행 CVE 14000건 중 CPE 가 있는 4516건의 "CPE 첫 항목" 빈도(primary_product 규칙이 쓰는 값)
#     예) Windows CVE 의 첫 항목은 windows_10_1607 이 165건, windows_10_22h2 는 1건이었다
#   - NVD CPE 사전 API(cpeMatchString)로 표기 존재·폐기(deprecated) 여부 확인
#   - 프론트(0e) 초안 50행을 이어받아 고쳤다
#   제외한 것: WordPress·Jenkins 플러그인(CPE vendor 가 플러그인 작성자라 자동으로 빠짐, KEV 는 Core 만 매핑),
#             "Microsoft / Edge and Internet Explorer" 처럼 두 제품을 대등하게 묶은 KEV 표기
#   여러 제품을 묶은 KEV 표기("iOS and macOS" 등)는 맨 앞 제품으로 매핑했다.
#
# 추가 2026-11-01 (Gate G "미매핑 대표 제품 상위 노출 건을 yml 에 추가", 백엔드 B)
#   근거: 첫 하루 실행(bbe0756) 뒤 Gate 점검 ② — 트렌드 상위 100건 중 표에 없던 대표 제품 44개(60건).
#   제조사와 표준 이름이 분명한 40개를 아래 "Gate G 추가" 묶음에 넣었다. 줄마다 출처(CPE vendor:product, KEV 표기, 예시 CVE)를 적는다.
#   CPE 별칭은 실제로 관찰한 표기만 넣었다(관찰하지 않은 판·모델 표기는 넣지 않음). KEV 가 "Multiple Products" 면 KEV 별칭을 넣지 않는다(위 (c)).
#   넣지 않은 것(애매함 — 다음 튜닝 때 다시 본다):
#     - brotli: CPE 제조사가 둘(google, andybalholm — 다른 구현). CVE-2026-111497
#     - connection_manager_for_objectscale (progress): KEV 표기는 "Progress / LoadMaster" 라 CPE 와 KEV 가 가리키는 제품이 다름. CVE-2026-8037
#     - enterprise_linux (redhat): 배포판이 CPE 첫 항목으로 나온 경우, 실제 제품은 libuser(KEV). CVE-2015-3246
#     - fedora (fedoraproject): 같은 경우, 실제 제품은 ProFTPD(KEV). CVE-2015-3306
#     - cisco:asyncos 의 KEV 표기 "Secure Email Gateway" 는 넣지 않았다(장비 이름 ≠ 운영체제 이름). CPE 별칭만 넣음
#
# 추가 2026-11-01 (조치 정보 튜닝, 오케스트레이터 지시 (나), 백엔드 B)
#   근거: 상위 100건 중 fix_versions 가 빈 14건. 대표 제품은 KEV 표기로 정해졌는데 미만 상한이 있는 CPE 줄이 표에 없어
#   대표 제품 줄로 이어지지 않던 2건만 별칭으로 이었다(제품 묶음 수는 그대로 90, CPE 별칭 3개 추가).
#     - microsoft:sql_server_2016 · sql_server_2017 → Microsoft SQL Server (CVE-2019-1068)
#     - michaelschwarz:ajax.net_professional → Ajax.NET Professional (CVE-2021-23758)
#   넣지 않은 것: 대표 제품과 미만 상한이 있는 줄이 다른 제품인 경우(enterprise_linux 의 libuser CVE-2015-3246,
#     Adobe Commerce 의 i/o_events CVE-2026-48356). 나머지 10건은 대표 제품 줄 자체에 미만 상한이 없다("<=", "=" 만 있거나 범위 없음).
#   다음 튜닝 후보(상위 100건 밖에서 관찰, 아직 넣지 않음): sql_server_2019·2022·2025, ajax.net_professional_project:ajax.net_professional

