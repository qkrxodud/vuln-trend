spring.application.name=vuln-trend-batch
spring.main.web-application-type=none
# 저장소 루트의 .env(NVD_API_KEY, DB_PORT)를 읽는다. 없으면 건너뛴다. bootRun 은 batch/ 에서 실행한다
spring.config.import=optional:file:${vulntrend.env-file:../.env}[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/vuln
spring.datasource.username=vuln
spring.datasource.password=vuln
spring.flyway.enabled=true

# 기본값을 비워 둔다. 비어 있으면 NvdClient(@PostConstruct)가 시작을 거부한다
nvd.api-key=${NVD_API_KEY:}
nvd.base-url=https://services.nvd.nist.gov/rest/json/cves/2.0
nvd.results-per-page=2000
nvd.max-window=120d
# 열쇠가 있을 때 30초에 50번 → 매 요청 전 0.6초
nvd.request-interval=600ms
# 429·5xx·연결 실패는 2초부터 두 배씩 쉬며 최대 5번까지 부른다
nvd.max-attempts=5
nvd.retry-backoff=2s
kev.url=https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# 5xx·연결 실패는 2초부터 두 배씩 쉬며 최대 3번까지 부른다. 그 밖의 4xx 는 바로 실패
kev.max-attempts=3
kev.retry-backoff=2s
kev.request-timeout=60s
# FIRST EPSS 전체 점수(gzip CSV). 2026-10-31 확인: 옛 epss.cyentia.com 은 이 주소로 301, current 는 그날 파일로 302
epss.url=https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
# 5xx·연결 실패는 2초부터 두 배씩 쉬며 최대 3번까지 부른다. 그 밖의 4xx 는 바로 실패
epss.max-attempts=3
epss.retry-backoff=2s
epss.request-timeout=120s
output.dir=../web/public/data
# 게시(WBS 4.3): 저장소 루트(배치는 batch/ 에서 돈다)와 push 할 원격 이름, git 명령 하나의 시간 한도
publish.repo-dir=..
publish.remote=${PUBLISH_REMOTE:origin}
publish.command-timeout=2m
# 요약 상한(한국 달력일): 하루 상한은 답을 받은 호출만, 실패 안전 상한은 실패한 호출만 센다(사용자 결정 2026-11-01)
summary.daily-limit=20
summary.daily-failure-limit=40
# 요약 모델 이름과 열쇠(WBS 6.1·6.2). 둘 중 하나라도 비면 요약 단계만 건너뛴다(비치명).
# OpenAI 공식 Java SDK 로 부른다(사용자 결정 2026-11-01). 모델 이름·열쇠 모두 코드에 기본값이 없다 — .env 에 적는다
summary.model=${SUMMARY_MODEL:}
summary.api-key=${SUMMARY_API_KEY:}
# CVE.org cvelistV5 제품 보강(S3a, 비치명). 공식 CVE Services 읽기 API — 열쇠 없이 부르고, 2026-11-02 응답 머리글은 1분에 25,000번 한도.
# 대표 제품 없는 최근 30일 CVE 만 한 건씩, 한 실행 최대 2,000건(30일 백필을 여러 실행에 나눔). 못 채운 CVE 는 하루 뒤에 다시 부른다
cvelist.base-url=https://cveawg.mitre.org/api/cve
cvelist.lookback=30d
cvelist.max-per-run=2000
cvelist.retry-after=1d
# 10번 연달아 실패하면 CVE.org 장애로 보고 이번 실행의 보강을 멈춘다
cvelist.max-consecutive-failures=10
cvelist.request-interval=100ms
# 5xx·429·연결 실패는 2초부터 두 배씩 쉬며 최대 3번까지 부른다. 404(레코드 없음) 등 그 밖의 4xx 는 바로 그 CVE 만 실패
cvelist.max-attempts=3
cvelist.retry-backoff=2s
cvelist.request-timeout=20s
