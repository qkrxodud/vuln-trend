spring.application.name=vuln-trend-batch
spring.main.web-application-type=none
# 저장소 루트의 .env(NVD_API_KEY, DB_PORT)를 읽는다. 없으면 건너뛴다. bootRun 은 batch/ 에서 실행한다
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/vuln
spring.datasource.username=vuln
spring.datasource.password=vuln
spring.flyway.enabled=true

# 기본값을 비워 둔다. 필수 검사는 NVD 호출 빈의 @PostConstruct 에서 한다(Phase 1.1)
nvd.api-key=${NVD_API_KEY:}
output.dir=../web/public/data
summary.daily-limit=20
