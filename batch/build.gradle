plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.vulntrend'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}


dependencies {
    // 웹서버 없는 배치(spring.main.web-application-type=none). 수집 경로 저장은 JdbcTemplate(기획서 5장 메모)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // 한국어 요약: Anthropic 공식 Java SDK 로 Claude 를 부른다(사용자 결정 2026-10-31, Spring AI 는 쓰지 않음)
    implementation 'com.anthropic:anthropic-java:3.3.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// 진입점 main 은 스프링을 띄우기만 한다 — 커버리지 집계에서 뺀다
def jacocoExcludes = ['com/vulntrend/batch/VulnTrendBatchApplication*']

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// Gate G 배치 점검(WBS 9장, 백엔드 B 의 GateCheckService): 읽기만 한다. 웹의 npm run gate:check 와 짝.
// 실행: (cd batch && ./gradlew gateCheck). 실패 항목이 있으면 종료 코드 1. NVD 키가 없으면 배치가 시작하지 않는다(사용자 결정)
tasks.register('gateCheck', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'verification'
    description = 'Runs the Gate G batch check (read-only) and prints the result table.'
    mainClass = 'com.vulntrend.batch.VulnTrendBatchApplication'
    classpath = sourceSets.main.runtimeClasspath
    args '--gate-check'
}
